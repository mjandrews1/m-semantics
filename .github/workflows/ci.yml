name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  dafny:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Dafny 4.11.0
        run: |
          set -euo pipefail
          curl -sL -o dafny.zip \
            https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip
          unzip -q dafny.zip
          echo "$PWD/dafny" >> "$GITHUB_PATH"
          "$PWD/dafny/dafny" --version

      - name: Verify MSemantics
        run: dafny verify MSemantics.dfy

      - name: Verify MPattern
        run: dafny verify MPattern.dfy

      - name: Verify MControl
        run: dafny verify MControl.dfy

      - name: Verify GraphStore
        run: dafny verify GraphStore.dfy

      - name: Verify BM25
        run: dafny verify BM25.dfy

      - name: Verify Scan
        run: dafny verify Scan.dfy

      - name: Verify MRelOps
        run: dafny verify MRelOps.dfy

      - name: Verify BST
        run: dafny verify BST.dfy
